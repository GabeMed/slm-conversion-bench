# Local end-to-end smoke test, no paid calls: every role on a tiny model served by llama.cpp,
# fake embeddings. Start the server with `scripts/serve-local.sh`.
extends: ../config.yaml

roles:
  production_llm:
    model: qwen3-4b-q4_k_m
    endpoint: {kind: llamacpp, base_url: "http://127.0.0.1:8080/v1", api_key_env: null}
    params: {max_tokens: 1024, timeout_s: 600}
    reasoning: {enabled: false}   # serve-local.sh serves it with --reasoning off
    terms: null
  cheap_alt:
    model: qwen3-4b-q4_k_m
    endpoint: {kind: llamacpp, base_url: "http://127.0.0.1:8080/v1", api_key_env: null}
    params: {max_tokens: 1024, timeout_s: 600}
    reasoning: {enabled: false}

embeddings:
  provider: fake

# serve-local.sh shares one 16k context among its 4 slots (--kv-unified): concurrent prompts of a few
# thousand tokens overflow it (HTTP 500 "Context size has been exceeded", measured), so one at a time
agent:
  max_workers: 1
