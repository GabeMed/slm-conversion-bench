# The teacher as Claude Opus 5.5 instead of config.yaml's Claude Sonnet 5.5: the same API, cache and terms
# (README, "Using a closed model as the teacher"). Not the registered configuration: what the pre-Stage-0
# cost probes ran, kept for a frontier-teacher extension (SPEC §3, extension 9). `--config configs/teacher-claude.yaml`.
extends: ../config.yaml

roles:
  production_llm:
    model: claude-opus-5-5
    params:
      output_config: {effort: medium}  # this model's default

prices:
  as_of: "2026-10-06"          # Anthropic's list price; confirm on its pricing page before runs
  table:
    claude-opus-5-5: {provider: anthropic, input_per_mtok: 4.0, cached_input_per_mtok: 0.20,
                      cache_write_per_mtok: 8.0,  # a 1-hour cache write: 2 x input
                      output_per_mtok: 20.0, batch_discount: 0.5}
