# The production LLM (the teacher) as Claude Sonnet 5.5: configs/teacher-claude.yaml with another model.
# Everything said there applies here (README, "Using a closed model as the teacher"). Effort is high,
# Sonnet's own default: how a team running it in production would run it.
extends: teacher-claude.yaml

roles:
  production_llm:
    model: claude-sonnet-5-5
    params:
      output_config: {effort: high}

prices:
  as_of: "2026-10-14"          # Anthropic's list price; confirm on its pricing page before runs
  table:
    claude-sonnet-5-5: {provider: anthropic, input_per_mtok: 2.0, cached_input_per_mtok: 0.20,
                        cache_write_per_mtok: 4.0,  # a 1-hour cache write: 2 x input
                        output_per_mtok: 10.0, batch_discount: 0.5}
