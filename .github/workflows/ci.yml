name: ci
on:
  push:
  pull_request:

jobs:
  core:
    # contracts, data splits, evaluation and the test barrier: no agent dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[test]"
      - run: pytest -q
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}

  agent-env:
    # P-1 on Linux: CHESS's pinned requirements install on Python 3.11 and the patched agent imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # CPU wheels of torch (pulled by CHESS's sentence-transformers pin); the agent never uses it
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r env/agent/requirements.lock -e ".[test]"
      - name: import the patched agent
        env: {DB_ROOT_PATH: /tmp, INDEX_SERVER_PORT: "0", ANONYMIZED_TELEMETRY: "False"}
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "vendor/chess/src")
          from bench.agent import hooks
          from bench.contracts.config import load_config
          hooks.configure(load_config("configs/smoke-local.yaml"))
          import llm.models, workflow.team_builder, runner.run_manager
          print("patched CHESS imports")
          PY
      - run: pytest -q

  analysis:
    # the judgments and the report (env/analysis: numpy, scipy, scikit-learn), never importing CHESS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r env/analysis/requirements.txt -e ".[test]"
      - run: pytest -q

  train:
    # training, load test and preflight (env/train: TRL, PEFT, AIPerf, Modal SDK) on CPU torch; the
    # lock's CUDA-only pins (several GB, used on Modal's GPUs only) are left out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: grep -vE '^(nvidia-(cu|nccl|nvjitlink|nvshmem|nvtx)|triton)' env/train/requirements.lock > "$RUNNER_TEMP/train-cpu.lock"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r "$RUNNER_TEMP/train-cpu.lock" -e ".[test]"
      # without the +cpu build pip would take the CUDA one and its libraries, unpinned: fail instead
      - run: python -c "import torch, sys; sys.exit(f'CUDA torch {torch.__version__}' if torch.version.cuda else 0)"
      - run: pytest -q
