[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-conversion-bench"
version = "0.1.0"
description = "Empirical run of the LLM-to-SLM conversion algorithm of arXiv 2506.02153 on the CHESS agent over BIRD"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.17"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
bench = "bench.cli:main"

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.setuptools.package-data]
"bench.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
